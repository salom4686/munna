<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Over Time Report</title>
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=11bxOPboUUmQxIkT6gMYWYqxfh9jZSiLo&sz=w500">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        
        :root {
            --brand-blue: #1e3a8a;
            --brand-gold: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        #initial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--brand-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #app-container { display: none; }

        .table-container {
            overflow-x: auto;
            max-width: 100%;
            scrollbar-width: thin;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 8px; 
            text-align: center;
            font-size: 13px; 
        }

        .sticky-sl { position: sticky; left: 0; background: white; z-index: 21; min-width: 40px; }
        .sticky-id { position: sticky; left: 40px; background: white; z-index: 21; min-width: 80px; }
        .sticky-name { 
            position: sticky; 
            left: 120px; 
            background: white; 
            z-index: 21; 
            min-width: 180px; 
            text-align: left; 
            border-right: 2px solid #cbd5e1 !important; 
        }

        thead th.sticky-sl, thead th.sticky-id, thead th.sticky-name {
            background-color: var(--brand-blue);
            color: white;
            z-index: 30;
        }

        .total-col {
            position: sticky;
            right: 0;
            background: #f8fafc;
            z-index: 20;
            font-weight: bold;
            border-left: 2px solid #cbd5e1 !important;
        }

        .sun-col { background-color: #fff1f2; color: #e11d48; }

        .suggestion-box {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 999;
            display: none;
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
        }

        .custom-calendar {
            position: absolute;
            top: 105%;
            left: 0;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            z-index: 1000;
            display: none;
            width: 320px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .calendar-day-cell {
            padding: 10px 0;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .calendar-day-cell:hover {
            background-color: var(--brand-blue);
            color: white;
        }

        .filter-label {
            display: block;
            text-transform: uppercase;
            font-weight: 800;
            color: #000000;
            font-size: 13px;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .brand-logo { height: 60px; width: auto; object-fit: contain; }

        .print-only { display: none; }

        @media print {
            @page { size: A4 landscape; margin: 0.5cm 1cm; }
            body { background-color: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
            #initial-overlay, .no-print, #idSuggestions, .custom-calendar, .suggestion-box, #printBtn { display: none !important; }
            #app-container { border: none !important; box-shadow: none !important; max-width: 100% !important; margin: 0 !important; }
            .print-only { display: block !important; }
            .table-container { overflow: visible !important; border: none !important; }
            table { border: 1px solid black !important; width: 100% !important; }
            th, td { border: 1px solid black !important; color: black !important; background: white !important; padding: 4px 2px !important; font-size: 11px !important; }
            thead th { background-color: #f2f2f2 !important; color: black !important; }
            .sticky-sl, .sticky-id, .sticky-name, .total-col { position: static !important; background: white !important; }
            .print-footer-info { display: flex !important; justify-content: center; gap: 20px; margin-top: 15px; font-size: 10px; border-top: 1px solid #ddd; padding-top: 5px; }
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="initial-overlay">
        <div class="loader-spinner mb-3"></div>
        <p class="text-blue-900 font-bold text-xs uppercase tracking-widest">Loading Data...</p>
    </div>

    <div id="app-container" class="max-w-[98%] mx-auto bg-white rounded-xl shadow-2xl border border-slate-200">
        
        <div class="bg-white px-5 py-4 flex flex-col md:flex-row justify-between items-center border-b border-slate-100 gap-4">
            <div class="flex items-center space-x-4">
                <img src="https://lh3.googleusercontent.com/d/11bxOPboUUmQxIkT6gMYWYqxfh9jZSiLo" alt="Alamhow Logo" class="brand-logo">
                <div>
                    <h1 class="text-2xl font-black text-blue-900 tracking-tight leading-none uppercase">ALAMHOW CO LTD.</h1>
                    <p class="text-[10px] text-amber-600 font-bold uppercase tracking-wider mt-1">Overtime Management Report</p>
                </div>
            </div>
            <div class="flex items-center gap-3 no-print">
                <div id="monthYearDisplay" class="px-4 py-1.5 bg-blue-50 text-blue-800 rounded-full text-xs font-bold border border-blue-100 shadow-sm"></div>
                <button onclick="handlePrint()" id="printBtn" class="hidden px-4 py-1.5 bg-slate-100 text-slate-700 rounded-full text-xs font-bold border border-slate-200 hover:bg-slate-200 transition-all flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Print Report
                </button>
            </div>
        </div>

        <div class="print-only px-2 pt-4 mb-2">
            <div class="flex justify-between items-end border-b-2 border-black pb-2">
                <div class="text-left">
                    
                    <h1 class="text-xl font-black uppercase tracking-tight">OVER TIME REPORT</h1>
                    
                 </div>
                 <div id="printFooterInfo" class="print-only print-footer-info">
                <span><strong>Printing Date:</strong> <span id="pd"></span></span>
                <span><strong>Printing Time:</strong> <span id="pt"></span></span>
            </div>
                <div class="text-right">
                    <p class="text-xs font-bold uppercase">
                        Period: <span id="printPeriodDisplay"></span>
                    </p>
                </div>
            </div>
        </div>

        <div class="p-5 bg-slate-50/50 border-b border-slate-100 relative no-print">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="relative">
                    <label class="filter-label">Search ID</label>
                    <input type="text" id="filterId" autocomplete="off" placeholder="ID or Name..." class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm font-medium transition-all">
                    <div id="idSuggestions" class="suggestion-box"></div>
                </div>
                <div>
                    <label class="filter-label">Site Location</label>
                    <select id="filterSite" class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm font-medium cursor-pointer transition-all">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <div class="relative">
                    <label class="filter-label">Start Date</label>
                    <input type="text" id="fromDate" readonly placeholder="YYYY-MM-DD" class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-lg outline-none cursor-pointer text-sm font-medium hover:border-blue-400 transition-all">
                    <div id="fromCalendar" class="custom-calendar"></div>
                </div>
                <div class="relative">
                    <label class="filter-label">End Date</label>
                    <input type="text" id="toDate" readonly placeholder="YYYY-MM-DD" class="w-full py-2.5 px-3 bg-white border border-slate-300 rounded-lg outline-none cursor-pointer text-sm font-medium hover:border-blue-400 transition-all">
                    <div id="toCalendar" class="custom-calendar"></div>
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="applyFilters()" class="flex-1 bg-blue-900 text-white font-bold py-2 px-4 rounded-lg text-xs uppercase shadow-md hover:bg-blue-800 h-[46px] transition-all">
                        View Report
                    </button>
                    <button onclick="showBreakdownOnly()" id="breakdownBtn" class="hidden px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-black transition-all flex items-center justify-center h-[46px] shadow-md">
                        <span class="text-xs font-bold uppercase">Breakdown</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="mainContent" class="hidden p-5">
            <div id="attendanceSection" class="block">
                <div class="table-container rounded-lg border border-slate-200 shadow-xl bg-white mb-6">
                    <table id="attendanceTable">
                        <thead id="attendanceHead"></thead>
                        <tbody id="attendanceBody" class="text-slate-600"></tbody>
                        <tfoot id="attendanceFoot" class="bg-slate-50 font-bold border-t-2 border-slate-200"></tfoot>
                    </table>
                </div>
            </div>

            <div id="detailedReportSection" class="hidden">
                <div class="table-container rounded-lg border border-slate-200 shadow-xl">
                    <table id="detailsTable">
                        <thead class="bg-slate-800 text-white text-xs">
                            <tr>
                                <th class="py-3 text-left pl-4">Date</th><th>ID</th><th class="text-left">Name</th>
                                <th class="text-left">Designation</th><th class="text-left">Site</th><th>Rate</th>
                                <th>Hours</th><th class="bg-slate-700">Total Amount</th>
                            </tr>
                        </thead>
                        <tbody id="detailsBody" class="text-sm"></tbody>
                        <tfoot id="detailsFoot" class="bg-blue-900 text-white font-bold text-base"></tfoot>
                    </table>
                </div>
            </div>

            
        </div>
    </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRrMcjKvg4pkCC3APIlH29Mxi0YgfFq_tySGnCCq83qsilRjBc2i0moIRgphnW6Svyrw/exec?get=data";
    let rawData = [];
    let uniqueEmployeeMap = [];
    const daysEn = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthsEn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // সিস্টেম ইনিশিয়েলাইজেশন
    async function initSystem() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            rawData = data.map(item => {
                const cleanedItem = {};
                for (let key in item) {
                    let val = item[key];
                    cleanedItem[key] = (typeof val === 'string') ? val.trim() : (val === null ? "" : val);
                }
                return cleanedItem;
            });
            initFilters();
            document.getElementById('initial-overlay').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        } catch (error) {
            document.getElementById('initial-overlay').innerHTML = `<p class="text-red-500">Error loading data. Please refresh.</p>`;
        }
    }

    // ফিল্টার ইনিশিয়েলাইজেশন
    function initFilters() {
        const seenIds = new Set();
        rawData.forEach(item => {
            const empId = String(item.id).trim();
            if (empId && !seenIds.has(empId)) {
                seenIds.add(empId);
                uniqueEmployeeMap.push({ id: empId, name: (item.name || "N/A").trim() });
            }
        });
        uniqueEmployeeMap.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
        
        const siteSelect = document.getElementById('filterSite');
        const sites = [...new Set(rawData.map(item => item.site))].filter(Boolean);
        sites.sort().forEach(site => {
            const opt = document.createElement('option');
            opt.value = site; opt.textContent = site;
            siteSelect.appendChild(opt);
        });

        setupCustomDatePicker('fromDate', 'fromCalendar');
        setupCustomDatePicker('toDate', 'toCalendar');
        setupIdSuggestions();
    }

    function setupCustomDatePicker(inputId, calendarId) {
        const input = document.getElementById(inputId);
        const calendar = document.getElementById(calendarId);
        input.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-calendar, .suggestion-box').forEach(el => el.style.display = 'none');
            calendar.style.display = 'block';
            renderCalendar(calendar, input);
        });
        document.addEventListener('click', (e) => { if (!calendar.contains(e.target)) calendar.style.display = 'none'; });
    }

    function renderCalendar(calendarEl, inputEl) {
        let initialDate = new Date();
        if (inputEl.value) {
            const parsed = new Date(inputEl.value);
            if (!isNaN(parsed.getTime())) initialDate = parsed;
        }
        let cMonth = initialDate.getMonth();
        let cYear = initialDate.getFullYear();

        const build = () => {
            const firstDay = new Date(cYear, cMonth, 1).getDay();
            const daysInMonth = new Date(cYear, cMonth + 1, 0).getDate();
            const selectedVal = inputEl.value;

            let html = `<div class="flex justify-between items-center mb-4 border-b pb-3">
                <button class="prev p-2 text-blue-700 font-bold hover:bg-blue-50 rounded-full">❮</button>
                <div class="text-base font-black text-blue-900">${monthsEn[cMonth]} ${cYear}</div>
                <button class="next p-2 text-blue-700 font-bold hover:bg-blue-50 rounded-full">❯</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-[11px] text-center font-bold text-slate-500 mb-3">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div><div class="grid grid-cols-7 gap-1">`;

            for (let i = 0; i < firstDay; i++) html += `<div></div>`;
            for (let i = 1; i <= daysInMonth; i++) {
                const ds = `${cYear}-${String(cMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isSelected = ds === selectedVal ? 'bg-amber-500 text-white font-bold' : '';
                html += `<div class="calendar-day-cell ${isSelected}" data-date="${ds}">${i}</div>`;
            }
            calendarEl.innerHTML = html + `</div>`;
            calendarEl.querySelector('.prev').onclick = (e) => { e.stopPropagation(); cMonth--; if(cMonth < 0){cMonth=11; cYear--;} build(); };
            calendarEl.querySelector('.next').onclick = (e) => { e.stopPropagation(); cMonth++; if(cMonth > 11){cMonth=0; cYear++;} build(); };
            calendarEl.querySelectorAll('.calendar-day-cell').forEach(c => {
                c.onclick = (e) => { e.stopPropagation(); inputEl.value = c.dataset.date; calendarEl.style.display = 'none'; };
            });
        };
        build();
    }

    function setupIdSuggestions() {
        const input = document.getElementById('filterId');
        const box = document.getElementById('idSuggestions');
        input.oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = uniqueEmployeeMap.filter(emp => emp.id.toLowerCase().includes(term) || emp.name.toLowerCase().includes(term)).slice(0, 10);
            if (filtered.length && term) {
                box.innerHTML = filtered.map(emp => `<div class="p-3 cursor-pointer border-b text-xs hover:bg-blue-50 flex justify-between" data-id="${emp.id}"><b>${emp.id}</b><span>${emp.name}</span></div>`).join('');
                box.style.display = 'block';
                box.querySelectorAll('div').forEach(d => d.onclick = () => { input.value = d.dataset.id; box.style.display = 'none'; });
            } else box.style.display = 'none';
        };
    }

    // ফিল্টার প্রয়োগ
    function applyFilters() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        if(!from || !to) return;
        const id = document.getElementById('filterId').value.trim().toLowerCase();
        const site = document.getElementById('filterSite').value;
        const startD = new Date(from);
        const endD = new Date(to);
        const filtered = rawData.filter(item => {
            const d = new Date(item.otDate);
            const matchId = id ? (String(item.id).toLowerCase().includes(id) || item.name.toLowerCase().includes(id)) : true;
            const matchSite = site ? item.site === site : true;
            return matchId && matchSite && d >= startD && d <= endD;
        });

        document.getElementById('attendanceSection').style.display = 'block';
        document.getElementById('detailedReportSection').style.display = 'none';
        document.getElementById('breakdownBtn').classList.remove('hidden');
        document.getElementById('printBtn').classList.remove('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        renderAll(filtered, startD, endD);
    }

    // ডাটা রেন্ডারিং (দশমিক ফিক্সসহ)
    function renderAll(data, start, end) {
        const dateRangeStr = `${start.toLocaleDateString('en-GB')} To ${end.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})}`;
        document.getElementById('monthYearDisplay').innerText = dateRangeStr;
        document.getElementById('printPeriodDisplay').innerText = dateRangeStr;

        const dateList = [];
        let curr = new Date(start);
        while(curr <= end){ dateList.push(new Date(curr)); curr.setDate(curr.getDate()+1); }

        const head = document.getElementById('attendanceHead');
        const body = document.getElementById('attendanceBody');
        const foot = document.getElementById('attendanceFoot');

        let hHtml = `<tr class="bg-blue-900 text-white"><th>SL</th><th class="sticky-id">ID</th><th class="sticky-name">EMPLOYEE NAME</th>`;
        dateList.forEach(d => { hHtml += `<th class="${d.getDay() === 0 ? 'bg-red-600' : ''} text-[9px] min-w-[32px]">${daysEn[d.getDay()]}<br>${d.getDate()}</th>`; });
        head.innerHTML = hHtml + `<th class="total-col bg-blue-900 text-white">TOTAL</th></tr>`;

        const employees = {};
        data.forEach(item => { if(!employees[item.id]) employees[item.id] = { name: item.name }; });
        const empIds = Object.keys(employees).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

        let gt = 0; const colTot = {};
        body.innerHTML = empIds.map((uid, idx) => {
            let rowTot = 0;
            let row = `<tr><td>${idx+1}</td><td class="sticky-id font-bold text-blue-900">${uid}</td><td class="sticky-name">${employees[uid].name}</td>`;
            dateList.forEach(d => {
                const ds = d.toLocaleDateString('en-CA');
                const entry = data.find(e => String(e.id) === uid && new Date(e.otDate).toLocaleDateString('en-CA') === ds);
                
                // শিটের ভ্যালুকে সংখ্যায় রূপান্তর (যা আছে তাই থাকবে)
                const hours = entry ? Number(entry.otHours) || 0 : 0;
                rowTot += hours; 
                colTot[ds] = (colTot[ds]||0) + hours;
                
                // সেল এ ডাটা দেখানোর সময় দশমিকসহ দেখানো
                row += `<td class="${d.getDay()===0?'sun-col':''}">${hours > 0 ? Number(hours.toFixed(2)) : '—'}</td>`;
            });
            gt += rowTot;
            return row + `<td class="total-col bg-blue-50 font-bold">${Number(rowTot.toFixed(2))}</td></tr>`;
        }).join('');

        let fHtml = `<tr><td colspan="3" class="text-right pr-2 font-bold">GRAND TOTAL</td>`;
        dateList.forEach(d => { 
            const cVal = colTot[d.toLocaleDateString('en-CA')] || 0;
            fHtml += `<td class="font-bold">${cVal > 0 ? Number(cVal.toFixed(2)) : '0'}</td>`; 
        });
        foot.innerHTML = fHtml + `<td class="total-col bg-blue-900 text-white font-bold">${Number(gt.toFixed(2))}</td></tr>`;

        // ব্রেকডাউন সেকশন
        const dBody = document.getElementById('detailsBody');
        const sortedDetails = [...data].sort((a, b) => new Date(a.otDate) - new Date(b.otDate));
        let tAmt = 0;
        dBody.innerHTML = sortedDetails.map(item => {
            const amt = Number(item.totalTaka) || 0; 
            tAmt += amt;
            const hVal = Number(item.otHours) || 0;
            return `<tr><td class="text-left pl-4">${item.otDate}</td><td>${item.id}</td><td class="text-left">${item.name}</td><td class="text-left">${item.designation||'-'}</td><td class="text-left">${item.site}</td><td>${item.otRate}</td><td>${Number(hVal.toFixed(2))}</td><td>${amt.toLocaleString()}</td></tr>`;
        }).join('');
        
        document.getElementById('detailsFoot').innerHTML = `<tr><td colspan="6" class="text-right px-6 font-bold">TOTAL</td><td class="font-bold">${Number(gt.toFixed(2))} hrs</td><td class="font-bold">${tAmt.toLocaleString()} /-</td></tr>`;
    }

    function showBreakdownOnly() {
        document.getElementById('attendanceSection').style.display = 'none';
        document.getElementById('detailedReportSection').classList.remove('hidden');
        document.getElementById('detailedReportSection').style.display = 'block';
    }

    function handlePrint() {
        const now = new Date();
        document.getElementById('pd').innerText = now.toLocaleDateString('en-GB');
        document.getElementById('pt').innerText = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        window.print();
    }

    window.onload = initSystem;
</script>
</body>
</html>
