<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAMHOW CO LTD - Advance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root {
            --brand-blue: #1e3a5f;
            --brand-gold: #d4af37;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* Flatpickr Custom Navy Blue Theme */
        .flatpickr-calendar {
            background: #fff;
            border: 1px solid var(--brand-blue);
            box-shadow: 0 10px 25px -5px rgba(30, 58, 95, 0.2);
            border-radius: 12px;
        }
        .flatpickr-day.selected, 
        .flatpickr-day.startRange, 
        .flatpickr-day.endRange, 
        .flatpickr-day.selected.prevMonthDay, 
        .flatpickr-day.selected.nextMonthDay, 
        .flatpickr-day.selected:hover, 
        .flatpickr-day.startRange:hover, 
        .flatpickr-day.endRange:hover, 
        .flatpickr-day.selected.prevMonthDay:hover, 
        .flatpickr-day.selected.nextMonthDay:hover {
            background: var(--brand-blue) !important;
            border-color: var(--brand-blue) !important;
            color: #fff !important;
        }
        .flatpickr-months .flatpickr-month,
        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-calendar.hasWeeks .flatpickr-weekdays,
        .flatpickr-calendar.hasTime .flatpickr-time,
        span.flatpickr-weekday {
            background: transparent;
            color: var(--brand-blue) !important;
            font-weight: 900;
        }
        .flatpickr-day.today {
            border-color: var(--brand-gold) !important;
        }
        .flatpickr-day.today:hover {
            background: var(--brand-gold) !important;
            color: white !important;
        }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border-left-color: var(--brand-blue);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .search-results {
            max-height: 250px;
            overflow-y: auto;
            position: absolute;
            width: 100%;
            z-index: 50;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin-top: 5px;
        }
        .search-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
        }
        .search-item:hover {
            background-color: #fef9c3; 
            border-left: 4px solid var(--brand-gold);
        }
        .id-badge {
            background-color: #f1f5f9;
            color: var(--brand-blue);
            font-weight: 900;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 12px;
            min-width: 60px;
            text-align: center;
        }

        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body * { visibility: hidden; }
            #receipt-print-area, #receipt-print-area * { 
                visibility: visible; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            #receipt-print-area { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .no-print { display: none !important; }
        }

        .receipt-slip {
            width: 47%; height: 680px; padding: 25px; border: 2px solid #1e3a5f; 
            position: relative; background: white !important; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .dual-receipt-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 10px; background: white !important;
        }
        .amount-words {
            font-size: 11px; font-weight: bold; text-transform: uppercase; color: #444; margin: 8px 0;
            font-style: italic; border-left: 3px solid #d4af37; padding-left: 8px;
        }
        
        .input-label {
            font-size: 10px;
            font-weight: 900;
            color: #1e3a5f;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-[#f0f2f5] min-h-screen py-6">

    <header class="page-wrapper mb-6 no-print">
        <div class="bg-[#1e3a5f] rounded-2xl shadow-lg border-b-4 border-[#d4af37]">
            <div class="px-6 py-4 flex justify-between items-center text-white">
                <div class="flex items-center space-x-4">
                    <div class="bg-white p-1 rounded-lg">
                        <img src="https://lh3.googleusercontent.com/d/11bxOPboUUmQxIkT6gMYWYqxfh9jZSiLo" alt="ALAMHOW" class="h-10 w-auto">
                    </div>
                    <div>
                        <h1 class="text-xl font-black uppercase tracking-tight">ALAMHOW <span class="text-[#d4af37]">CO LTD</span></h1>
                        <p class="text-[9px] font-bold opacity-60 tracking-[0.2em] mt-1">ADVANCE MANAGEMENT SYSTEM</p>
                    </div>
                </div>
                <div id="header-date" class="text-[10px] font-mono font-bold uppercase"></div>
            </div>
        </div>
    </header>

    <main class="page-wrapper no-print">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-slate-50/50 px-8 py-5 border-b flex justify-between items-center">
                <h2 class="font-black text-[#1e3a5f] uppercase text-sm">New Advance Entry</h2>
                <div class="flex items-center space-x-3">
                    <span class="text-[10px] font-bold text-[#1e3a5f] uppercase">Voucher No:</span>
                    <span id="next-adv-no" class="text-xs font-mono font-black text-[#1e3a5f] bg-slate-100 px-2 py-1 rounded">Voucher No Search...</span>
                </div>
            </div>

            <form id="advance-form" onsubmit="return false;" class="p-8 lg:p-10">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-3 relative">
                        <label class="input-label">Search Employee</label>
                        <input type="text" id="emp-search" autocomplete="off" placeholder="Type ID..." class="w-full p-2 rounded-lg border-2 bg-slate-50 font-bold outline-none border-slate-100 focus:border-[#d4af37]">
                        <div id="search-results" class="search-results"></div>
                        <input type="hidden" id="selected-emp-id">
                    </div>
                    <div class="md:col-span-3">
                        <label class="input-label">Employee Name</label>
                        <input type="text" id="display-name" readonly class="w-full p-2 rounded-lg border bg-slate-100 font-bold text-slate-500 uppercase">
                    </div>
                    <div class="md:col-span-3">
                        <label class="input-label">Passport No</label>
                        <input type="text" id="auto-passport" readonly class="w-full p-2 rounded-lg border bg-slate-100 font-mono text-slate-500">
                    </div>
                    <div class="md:col-span-3">
                        <label class="input-label">Designation</label>
                        <input type="text" id="display-desig" readonly class="w-full p-2 rounded-lg border bg-slate-100 font-bold text-slate-500 uppercase">
                    </div>

                    <div class="md:col-span-3 relative">
                        <label class="input-label">Received Date</label>
                        <div class="relative">
                            <input type="text" id="record-date" placeholder="Select Date" readonly class="w-full p-2 rounded-lg border-2 bg-white font-bold outline-none cursor-pointer border-slate-200">
                            <i class="fas fa-calendar-alt absolute right-3 top-1/2 -translate-y-1/2 text-[#1e3a5f] pointer-events-none"></i>
                        </div>
                    </div>

                    <div class="md:col-span-3">
                        <label class="input-label">Advance Amount</label>
                        <input type="number" id="advance-amount" class="w-full p-2 rounded-lg border-2 font-black text-[#1e3a5f] text-lg border-slate-200 focus:border-[#1e3a5f]">
                    </div>

                    <div class="md:col-span-3">
                        <label class="input-label">Reference</label>
                        <input type="text" id="reference" class="w-full p-2 rounded-lg border-2 border-slate-200">
                    </div>
                    <div class="md:col-span-3">
                        <label class="input-label">Remark</label>
                        <input type="text" id="remark" class="w-full p-2 rounded-lg border-2 border-slate-200">
                    </div>

                    <div class="md:col-span-12 mt-4">
                        <button type="button" onclick="directSaveToSheet()" class="w-full bg-[#1e3a5f] text-white font-black py-4 rounded-xl shadow-lg uppercase tracking-widest text-sm hover:bg-[#162a44] transition-all transform active:scale-[0.99]">
                            Confirm & Save Advance
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[60]">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center border-t-8 border-[#d4af37]">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl mb-4 mx-auto">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 class="text-xl font-black text-[#1e3a5f] mb-2 uppercase"> Saved!</h3>
            <p class="text-slate-500 text-[11px] font-bold mb-6 uppercase">Save successful</p>
            <div class="grid grid-cols-2 gap-3 w-full">
                <button onclick="prepareAndPrint()" class="bg-[#1e3a5f] text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-widest">Print Receipt</button>
                <button onclick="resetEntry()" class="bg-slate-100 text-slate-600 font-black py-3 rounded-xl uppercase text-[10px] tracking-widest">New Entry</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal (Custom Message Box) -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[70]">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center border-t-8 border-red-500 shadow-2xl">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-3xl mb-4 mx-auto">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="text-lg font-black text-[#1e3a5f] mb-2 uppercase">Attention!</h3>
            <p id="alert-msg" class="text-slate-600 text-[11px] font-bold mb-6 uppercase tracking-wider leading-relaxed">Required fields are missing.</p>
            <button onclick="closeAlert()" class="w-full bg-[#1e3a5f] text-white font-black py-3 rounded-xl uppercase text-[11px] tracking-widest hover:bg-[#162a44]">
                Got It
            </button>
        </div>
    </div>
    
    <div id="loader" class="fixed inset-0 bg-slate-900/80 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl flex flex-col items-center">
            <div class="loading-spinner mb-4"></div>
            <p class="text-[#1e3a5f] font-black uppercase text-xs tracking-widest">Saving to Cloud...</p>
        </div>
    </div>

    <div id="receipt-print-area" class="hidden"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhmAYu0RWFiAo0U_1cqtUy1OwrVM2cBIf9Dw-yO8EEYblsLt4bYoxPqF1mesCobrmXJA/exec";
        let employees = [];
        let lastSavedEntries = [];

        window.onload = () => {
            const now = new Date();
            document.getElementById('header-date').innerText = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            
            flatpickr("#record-date", {
                dateFormat: "d/m/Y",
                allowInput: true,
                disableMobile: true
            });

            fetchEmployees();
            fetchNextVoucher();
            setupSearch();
        };

        // Custom Alert Function
        function showAlert(msg) {
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        async function fetchNextVoucher() {
            document.getElementById('next-adv-no').innerText = "Voucher No Search...";
            try {
                const r = await fetch(`${SCRIPT_URL}?action=getNextVoucher`);
                const data = await r.json();
                if (data.nextVoucher) {
                    document.getElementById('next-adv-no').innerText = data.nextVoucher;
                }
            } catch (e) {
                document.getElementById('next-adv-no').innerText = "VOUCHER-ERR";
            }
        }

        async function fetchEmployees() {
            try { 
                const r = await fetch(`${SCRIPT_URL}?action=getEmployees`); 
                employees = await r.json(); 
            } catch(e) {}
        }

        function resetEntry() {
            document.getElementById('advance-form').reset();
            document.getElementById('selected-emp-id').value = "";
            document.getElementById('display-name').value = "";
            document.getElementById('auto-passport').value = "";
            document.getElementById('display-desig').value = "";
            document.getElementById('success-modal').classList.add('hidden');
            fetchNextVoucher(); 
        }

        function numberToWords(num) {
            const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
            const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const numStr = num.toString();
            if (numStr.length > 9) return 'Amount too large';
            let n = ('000000000' + numStr).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
            if (!n) return ''; 
            let str = '';
            str += (Number(n[1]) != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
            str += (Number(n[2]) != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
            str += (Number(n[3]) != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
            str += (Number(n[4]) != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
            str += (Number(n[5]) != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
            return str ? str + 'Taka Only' : 'Zero Taka Only';
        }

        function setupSearch() {
            const input = document.getElementById('emp-search');
            const res = document.getElementById('search-results');
            input.addEventListener('focus', () => showFilteredResults(input.value));
            input.addEventListener('input', (e) => showFilteredResults(e.target.value));
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !res.contains(e.target)) res.style.display = 'none';
            });
        }

        function showFilteredResults(val) {
            const res = document.getElementById('search-results');
            const lowerVal = val.toLowerCase();
            const filtered = employees.filter(emp => {
                const name = (emp.name || emp['employee name'] || "").toString().toLowerCase();
                const id = (emp.id || "").toString().toLowerCase();
                return name.includes(lowerVal) || id.includes(lowerVal);
            }).slice(0, 10);
            if (filtered.length > 0) {
                res.innerHTML = filtered.map(emp => `
                    <div class="search-item" onclick="selectEmployee('${emp.id}')">
                        <span class="id-badge">${emp.id}</span>
                        ${emp.name || emp['employee name'] || 'Unknown'}
                    </div>
                `).join('');
                res.style.display = 'block';
            } else res.style.display = 'none';
        }

        function selectEmployee(id) {
            const emp = employees.find(e => e.id == id);
            if(emp) {
                document.getElementById('emp-search').value = id;
                document.getElementById('selected-emp-id').value = id;
                document.getElementById('display-name').value = (emp.name || emp['employee name'] || "").toString().toUpperCase();
                document.getElementById('auto-passport').value = (emp.passport || emp['passport no'] || "---").toString();
                document.getElementById('display-desig').value = (emp.designation || emp.desig || "---").toString().toUpperCase();
                document.getElementById('search-results').style.display = 'none';
                document.getElementById('advance-amount').focus();
            }
        }

        async function directSaveToSheet() {
            const id = document.getElementById('selected-emp-id').value;
            const amt = document.getElementById('advance-amount').value;
            const rDate = document.getElementById('record-date').value;
            
            // Validation with Custom Alert
            if(!id) return showAlert("Please select an employee first.");
            if(!rDate) return showAlert("Please select a record date.");
            if(!amt || amt <= 0) return showAlert("Please enter a valid advance amount.");
            
            document.getElementById('loader').classList.remove('hidden');
            const entry = {
                advanceNo: document.getElementById('next-adv-no').innerText,
                tsDate: new Date().toLocaleDateString('en-GB'),
                tsTime: new Date().toLocaleTimeString('en-GB'),
                recordDate: rDate, id: id,
                name: document.getElementById('display-name').value,
                desig: document.getElementById('display-desig').value,
                passport: document.getElementById('auto-passport').value,
                amount: amt, amountWords: numberToWords(amt),
                reference: document.getElementById('reference').value,
                remark: document.getElementById('remark').value
            };
            lastSavedEntries = [entry];
            try {
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify([entry]) });
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('success-modal').classList.remove('hidden');
            } catch(e) { 
                document.getElementById('loader').classList.add('hidden'); 
                showAlert("Sync failed! Check internet connection.");
            }
        }

        function getReceiptHTML(item, copyType) {
            return `
                <div class="receipt-slip">
                    <div style="position: absolute; top: 15px; right: 15px; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 1px solid #1e3a5f; padding: 2px 8px; border-radius: 4px; background: white !important; color: #1e3a5f !important;">${copyType} Copy</div>
                    <div style="display: flex; align-items: center; justify-content: center; border-bottom: 2.5px solid #1e3a5f; padding-bottom: 12px; margin-bottom: 15px; gap: 10px;">
                        <img src="https://lh3.googleusercontent.com/d/11bxOPboUUmQxIkT6gMYWYqxfh9jZSiLo" style="height: 35px;">
                        <div style="text-align: left;">
                            <h2 style="margin: 0; font-size: 22px; font-weight: 900; color: #1e3a5f !important;">ALAMHOW <span style="color: #d4af37 !important;">CO LTD</span></h2>
                            <p style="margin: 0; font-size: 9px; text-transform: uppercase; font-weight: 800; color: #333 !important; text-align: center;"> 
    Advance Money Receipt
</p>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 15px; font-weight: 900; color: #1e3a5f !important;">
                        <span>VOUCHER NO: ${item.advanceNo}</span>
                        <span>DATE: ${item.recordDate}</span>
                    </div>
                    <div style="font-size: 13px; line-height: 2.2;">
                        <div style="display: flex; border-bottom: 1px dashed #ccc;"><span style="width: 100px; font-weight: 800; color: #555 !important;">ID</span>: <strong style="color: #000 !important;">${item.id}</strong></div>
                        <div style="display: flex; border-bottom: 1px dashed #ccc;"><span style="width: 100px; font-weight: 800; color: #555 !important;">NAME</span>: <strong style="color: #000 !important;">${item.name}</strong></div>
                        <div style="display: flex; border-bottom: 1px dashed #ccc;"><span style="width: 100px; font-weight: 800; color: #555 !important;">DESIG</span>: <span style="color: #000 !important;">${item.desig}</span></div>
                        <div style="display: flex; border-bottom: 1px dashed #ccc;"><span style="width: 100px; font-weight: 800; color: #555 !important;">PASSPORT</span>: <span style="color: #000 !important;">${item.passport}</span></div>
                        <div style="margin-top: 15px; background: #1e3a5f !important; color: white !important; padding: 12px; border: 2.5px solid #d4af37 !important; text-align: center; border-radius: 6px; -webkit-print-color-adjust: exact;"><span style="font-size: 18px; font-weight: 900;">AMOUNT: ${Number(item.amount).toLocaleString()} /-</span></div>
                        <div class="amount-words" style="border-left: 3px solid #d4af37 !important;">In Words: ${item.amountWords}</div>
                    </div>
                    <div style="flex-grow: 1; margin-top: 15px;">
                        <div style="font-size: 9px; font-weight: 900; color: #1e3a5f !important;">REFERENCE:</div><div style="font-size: 10px; color: #000 !important;">${item.reference || ''}</div>
                        <div style="font-size: 9px; font-weight: 900; margin-top: 5px; color: #1e3a5f !important;">REMARKS:</div><div style="font-size: 10px; font-style: italic; color: #000 !important;">${item.remark || ''}</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: auto; padding-bottom: 30px;">
                        <div style="text-align: center; width: 100px;"><div style="border-top: 1px solid #1e3a5f !important;"></div><span style="font-size: 9px; font-weight: 900; color: #1e3a5f !important;">RECEIVER</span></div>
                        <div style="text-align: center; width: 100px;"><div style="border-top: 1px solid #1e3a5f !important;"></div><span style="font-size: 9px; font-weight: 900; color: #1e3a5f !important;">ACCOUNTS</span></div>
                        <div style="text-align: center; width: 100px;"><div style="border-top: 1px solid #1e3a5f !important;"></div><span style="font-size: 9px; font-weight: 900; color: #1e3a5f !important;">AUTHORIZED</span></div>
                    </div>
                    <div style="position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 8px; color: #888 !important;">OFFICIAL SYSTEM RECORD • ${item.tsDate} | ${item.tsTime}</div>
                </div>
            `;
        }

        function prepareAndPrint() {
            const printArea = document.getElementById('receipt-print-area');
            let htmlContent = '';
            lastSavedEntries.forEach((item) => {
                htmlContent += `<div class="dual-receipt-wrapper">${getReceiptHTML(item, 'Office')}<div style="width: 5%; height: 680px; position: relative;"><div style="border-left: 2px dotted #1e3a5f; height: 100%; position: absolute; left: 50%;"></div></div>${getReceiptHTML(item, 'Employee')}</div>`;
            });
            printArea.innerHTML = htmlContent;
            printArea.classList.remove('hidden');
            setTimeout(() => { window.print(); printArea.classList.add('hidden'); }, 500);
        }
    </script>
</body>
</html>
